<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VectraFlow OR — FTL/LTL Enterprise Dispatch Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0A0E17;
            color: #E2E8F0;
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0A0E17; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 229, 255, 0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 229, 255, 0.4); }

        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1rem;
        }

        .glass-panel-light {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 0.75rem;
        }

        /* Map Grid Background */
        .map-grid-bg {
            background-color: #050810;
            background-image: 
                linear-gradient(rgba(0, 229, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.05) 1px, transparent 1px),
                radial-gradient(circle at center, rgba(0, 229, 255, 0.1) 0%, transparent 60%);
            background-size: 40px 40px, 40px 40px, 100% 100%;
        }

        /* Custom Slider */
        .custom-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            outline: none;
        }
        .custom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: #00E5FF;
            border: 3px solid #0A0E17;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.6);
            transition: transform 0.2s;
        }
        .custom-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }
        .custom-slider::-moz-range-thumb {
            width: 16px; height: 16px; background: #00E5FF; border: 3px solid #0A0E17;
            border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px rgba(0, 229, 255, 0.6);
        }

        /* SVG Flow Animation */
        @keyframes dash-flow { to { stroke-dashoffset: -100; } }
        .flow-line { stroke-dasharray: 6 6; animation: dash-flow 2s linear infinite; }

        /* Glow Effects */
        .glow-cyan { box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); }
        .glow-emerald { box-shadow: 0 0 15px rgba(0, 240, 163, 0.4); }
        .text-glow-cyan { text-shadow: 0 0 8px rgba(0, 229, 255, 0.6); }

        /* Gradient Text */
        .gradient-text {
            background: linear-gradient(135deg, #00E5FF 0%, #00F0A3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Toast Animation */
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast { animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        "use client";
        const { useState, useEffect, useRef } = React;

        // --- Icon Component ---
        const Icon = ({ name, className = "w-4 h-4", color = "currentColor" }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (ref.current) {
                    ref.current.innerHTML = '';
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name);
                    i.className = className;
                    i.style.color = color;
                    ref.current.appendChild(i);
                    lucide.createIcons();
                }
            }, [name, className, color]);
            return <div ref={ref} className="inline-flex items-center justify-center"></div>;
        };

        // --- UI Primitives (Shadcn-like) ---
        const Card = ({ children, className = "" }) => (
            <div className={`glass-panel shadow-xl ${className}`}>{children}</div>
        );

        const Button = ({ children, variant = "primary", className = "", ...props }) => {
            const base = "flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl font-semibold transition-all duration-300 text-sm active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed";
            const variants = {
                primary: "bg-gradient-to-r from-[#00E5FF] to-[#00F0A3] text-[#0A0E17] hover:shadow-[0_0_20px_rgba(0,229,255,0.4)]",
                secondary: "bg-white/5 border border-white/20 text-white hover:bg-white/10 hover:border-[#00E5FF]/50",
                danger: "bg-rose-500/10 border border-rose-500/30 text-rose-400 hover:bg-rose-500/20",
                ghost: "text-slate-400 hover:text-white hover:bg-white/5"
            };
            return <button className={`${base} ${variants[variant]} ${className}`} {...props}>{children}</button>;
        };

        const StardustButton = ({
            children,
            variant = "cosmic",
            size = "md",
            className = "",
            particleCount = 45,
            particleSpeed = 1.0,
            theme = "system",
            ...props
        }) => {
            const buttonRef = useRef(null);
            const canvasRef = useRef(null);
            const [isHovered, setIsHovered] = useState(false);
            const [isPressed, setIsPressed] = useState(false);
            const [isDarkMode, setIsDarkMode] = useState(true);
            const [mousePos, setMousePos] = useState({ x: 0, y: 0 });

            useEffect(() => {
                const checkTheme = () => {
                    if (theme === "system") {
                        setIsDarkMode(true); // Dashboard is always dark mode
                    } else {
                        setIsDarkMode(theme === "dark");
                    }
                };
                checkTheme();
            }, [theme]);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext("2d");
                if (!ctx) return;

                let animationFrameId;
                let particles = [];
                let width = (canvas.width = canvas.offsetWidth);
                let height = (canvas.height = canvas.offsetHeight);

                const resizeObserver = new ResizeObserver((entries) => {
                    for (let entry of entries) {
                        width = canvas.width = entry.contentRect.width;
                        height = canvas.height = entry.contentRect.height;
                    }
                });
                if (buttonRef.current) resizeObserver.observe(buttonRef.current);

                const particleColors = {
                    cosmic: isDarkMode ? ["#6366f1", "#a855f7", "#ec4899", "#fbbf24"] : ["#4f46e5", "#7c3aed", "#db2777", "#d97706"],
                    aurora: isDarkMode ? ["#10b981", "#06b6d4", "#6366f1", "#a855f7"] : ["#059669", "#0891b2", "#2563eb", "#7c3aed"],
                    nebula: isDarkMode ? ["#ec4899", "#f43f5e", "#d946ef", "#8b5cf6"] : ["#db2777", "#e11d48", "#c084fc", "#6d28d9"],
                    glass: isDarkMode ? ["#ffffff", "#e4e4e7", "#a1a1aa", "#d4d4d8"] : ["#09090b", "#27272a", "#52525b", "#71717a"],
                };

                const colors = particleColors[variant] || particleColors.cosmic;

                const createParticle = (x, y, isBurst = false) => {
                    const angle = Math.random() * Math.PI * 2;
                    const sizeVal = Math.random() * 1.5 + 0.5;
                    const speed = isBurst ? Math.random() * 3 + 1 : Math.random() * 0.6 + 0.2;
                    return {
                        x, y,
                        vx: Math.cos(angle) * speed * particleSpeed,
                        vy: Math.sin(angle) * speed * particleSpeed,
                        size: sizeVal,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        alpha: isBurst ? 1.0 : Math.random() * 0.6 + 0.4,
                        decay: isBurst ? Math.random() * 0.03 + 0.02 : Math.random() * 0.008 + 0.005,
                        angle: angle,
                        orbitRadius: Math.random() * 40 + 10,
                        speed: speed,
                    };
                };

                for (let i = 0; i < (isHovered ? particleCount : particleCount / 3); i++) {
                    particles.push(createParticle(Math.random() * width, Math.random() * height));
                }

                const handleBurst = (e) => {
                    const { x, y } = e.detail;
                    for (let i = 0; i < 20; i++) particles.push(createParticle(x, y, true));
                };
                canvas.addEventListener("particle-burst", handleBurst);

                const animate = () => {
                    ctx.clearRect(0, 0, width, height);
                    const targetCount = isHovered ? particleCount : particleCount / 3;
                    if (particles.length < targetCount && Math.random() < 0.3) {
                        particles.push(
                            createParticle(
                                isHovered ? mousePos.x + (Math.random() * 20 - 10) : Math.random() * width,
                                isHovered ? mousePos.y + (Math.random() * 20 - 10) : Math.random() * height
                            )
                        );
                    }

                    ctx.beginPath();
                    particles.forEach((p, idx) => {
                        if (isHovered) {
                            const dx = mousePos.x - p.x;
                            const dy = mousePos.y - p.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < 80) {
                                const force = (80 - dist) / 80;
                                p.vx += (dx / dist) * force * 0.08;
                                p.vy += (dy / dist) * force * 0.08;
                                p.vx += -(dy / dist) * force * 0.15;
                                p.vy += (dx / dist) * force * 0.15;
                            }
                        }
                        p.x += p.vx;
                        p.y += p.vy;
                        p.alpha -= p.decay;

                        if (p.x < 0 || p.x > width) p.vx *= -1;
                        if (p.y < 0 || p.y > height) p.vy *= -1;

                        ctx.save();
                        ctx.globalAlpha = Math.max(0, p.alpha);
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        if (p.size > 1.2) {
                            ctx.shadowBlur = 4;
                            ctx.shadowColor = p.color;
                        }
                        ctx.fill();
                        ctx.restore();

                        if (p.alpha <= 0) particles.splice(idx, 1);
                    });
                    animationFrameId = requestAnimationFrame(animate);
                };
                animate();

                return () => {
                    cancelAnimationFrame(animationFrameId);
                    resizeObserver.disconnect();
                    canvas.removeEventListener("particle-burst", handleBurst);
                };
            }, [isHovered, mousePos, variant, particleCount, particleSpeed, isDarkMode]);

            const handleMouseMove = (e) => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const rect = canvas.getBoundingClientRect();
                setMousePos({ x: e.clientX - rect.left, y: e.clientY - rect.top });
            };

            const handleMouseDown = (e) => {
                setIsPressed(true);
                const canvas = canvasRef.current;
                if (!canvas) return;
                const rect = canvas.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;
                const customEvent = new CustomEvent("particle-burst", { detail: { x: clickX, y: clickY } });
                canvas.dispatchEvent(customEvent);
            };

            const sizeClasses = {
                sm: "text-xs px-4 py-2 rounded-lg",
                md: "text-sm px-6 py-3 rounded-xl",
                lg: "text-base px-8 py-4 rounded-2xl",
                xl: "text-lg px-10 py-5 rounded-[20px]",
            };

            const getStyles = () => {
                if (isDarkMode) {
                    switch (variant) {
                        case "aurora": return { bg: "bg-emerald-950/20 backdrop-blur-md", border: "border-emerald-500/20 hover:border-emerald-400/40", textColor: "text-emerald-300 hover:text-white", glow: "shadow-[0_0_20px_rgba(16,185,129,0.15)]" };
                        case "nebula": return { bg: "bg-pink-955/15 backdrop-blur-md", border: "border-pink-500/20 hover:border-pink-400/40", textColor: "text-pink-300 hover:text-white", glow: "shadow-[0_0_20px_rgba(236,72,153,0.15)]" };
                        case "glass": return { bg: "bg-white/5 backdrop-blur-md", border: "border-white/10 hover:border-white/20", textColor: "text-zinc-200 hover:text-white", glow: "shadow-none" };
                        case "cosmic": default: return { bg: "bg-indigo-950/25 backdrop-blur-md", border: "border-indigo-500/25 hover:border-indigo-400/45", textColor: "text-indigo-300 hover:text-white", glow: "shadow-[0_0_20px_rgba(99,102,241,0.2)]" };
                    }
                } else {
                    switch (variant) {
                        case "aurora": return { bg: "bg-emerald-50/70 backdrop-blur-md", border: "border-emerald-200 hover:border-emerald-300/60", textColor: "text-emerald-700 hover:text-emerald-950", glow: "shadow-[0_0_15px_rgba(16,185,129,0.1)]" };
                        case "nebula": return { bg: "bg-pink-50/70 backdrop-blur-md", border: "border-pink-200 hover:border-pink-300/60", textColor: "text-pink-700 hover:text-pink-950", glow: "shadow-[0_0_15px_rgba(236,72,153,0.1)]" };
                        case "glass": return { bg: "bg-black/5 backdrop-blur-md", border: "border-black/5 hover:border-black/15", textColor: "text-zinc-800 hover:text-black", glow: "shadow-none" };
                        case "cosmic": default: return { bg: "bg-indigo-50/70 backdrop-blur-md", border: "border-indigo-200/50 hover:border-indigo-300/80", textColor: "text-indigo-700 hover:text-indigo-950", glow: "shadow-[0_0_15px_rgba(99,102,241,0.1)]" };
                    }
                }
            };

            const style = getStyles();

            return (
                <button
                    ref={buttonRef}
                    onMouseMove={handleMouseMove}
                    onMouseEnter={() => setIsHovered(true)}
                    onMouseLeave={() => { setIsHovered(false); setIsPressed(false); }}
                    onMouseDown={handleMouseDown}
                    onMouseUp={() => setIsPressed(false)}
                    className={`relative overflow-hidden group select-none transition-all duration-300 flex items-center justify-center font-semibold tracking-wide border border-solid ${style.border} ${style.bg} ${style.textColor} ${sizeClasses[size]} ${isHovered ? style.glow : "shadow-sm"} ${className}`}
                    style={{ transform: isPressed ? "scale(0.96)" : isHovered ? "scale(1.02)" : "scale(1)", transition: "transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.3s, border-color 0.3s, box-shadow 0.3s" }}
                    {...props}
                >
                    <canvas ref={canvasRef} className="absolute inset-0 pointer-events-none w-full h-full" style={{ mixBlendMode: isDarkMode ? "screen" : "multiply", opacity: isHovered ? 0.9 : 0.45, transition: "opacity 0.5s ease" }} />
                    <span className="relative z-10 flex items-center gap-2">{children}</span>
                </button>
            );
        };

        const Badge = ({ children, color = "cyan" }) => {
            const colors = {
                cyan: "bg-[#00E5FF]/10 text-[#00E5FF] border-[#00E5FF]/30",
                emerald: "bg-[#00F0A3]/10 text-[#00F0A3] border-[#00F0A3]/30",
                amber: "bg-amber-400/10 text-amber-400 border-amber-400/30",
                rose: "bg-rose-500/10 text-rose-400 border-rose-500/30",
                slate: "bg-slate-500/10 text-slate-400 border-slate-500/30"
            };
            return <span className={`text-[10px] font-bold px-2 py-1 rounded-md border ${colors[color]} flex items-center gap-1`}>{children}</span>;
        };

        const Select = ({ value, onChange, options, className="" }) => {
            const [open, setOpen] = useState(false);
            const selected = options.find(o => o.value === value);
            return (
                <div className="relative w-full">
                    <button 
                        onClick={() => setOpen(!open)}
                        className={`w-full flex items-center justify-between px-3 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white hover:border-[#00E5FF]/50 transition-colors ${className}`}
                    >
                        <span className="font-medium truncate">{selected?.label || "Select..."}</span>
                        <Icon name="ChevronDown" className="w-4 h-4 text-slate-400" />
                    </button>
                    {open && (
                        <div className="absolute z-20 mt-1 w-full bg-[#111827] border border-white/10 rounded-xl shadow-2xl py-2 backdrop-blur-xl max-h-60 overflow-y-auto">
                            {options.map(opt => (
                                <div 
                                    key={opt.value}
                                    onClick={() => { onChange(opt.value); setOpen(false); }}
                                    className={`px-4 py-2 text-sm cursor-pointer transition-colors ${value === opt.value ? 'text-[#00E5FF] bg-white/5' : 'text-slate-300 hover:bg-white/5'}`}
                                >
                                    {opt.label}
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const Slider = ({ label, value, min, max, unit, onChange }) => (
            <div>
                <div className="flex justify-between items-center mb-2">
                    <label className="text-xs font-medium text-slate-400 uppercase tracking-wider">{label}</label>
                    <span className="text-sm font-bold text-[#00E5FF] bg-[#00E5FF]/10 px-2 py-0.5 rounded-md">{value} {unit}</span>
                </div>
                <input type="range" min={min} max={max} value={value} onChange={(e) => onChange(e.target.value)} className="custom-slider" />
            </div>
        );

        const Input = ({ label, type = "text", value, onChange, placeholder = "" }) => (
            <div>
                <label className="text-[10px] font-medium text-slate-500 uppercase tracking-wider mb-1 block">{label}</label>
                <input 
                    type={type} 
                    value={value} 
                    onChange={onChange} 
                    placeholder={placeholder}
                    className="w-full px-3 py-2 bg-white/5 border border-white/10 rounded-lg text-sm text-white placeholder-slate-600 focus:outline-none focus:border-[#00E5FF]/50 focus:bg-white/10 transition-colors"
                />
            </div>
        );

        // --- Toast System ---
        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const colors = {
                success: "bg-emerald-500/10 border-emerald-500/30 text-emerald-400",
                error: "bg-rose-500/10 border-rose-500/30 text-rose-400",
                info: "bg-[#00E5FF]/10 border-[#00E5FF]/30 text-[#00E5FF]"
            };

            return (
                <div className={`fixed bottom-6 right-6 z-50 px-4 py-3 rounded-xl border backdrop-blur-lg shadow-2xl toast ${colors[type]}`}>
                    <div className="flex items-center gap-2 text-sm font-medium">
                        <Icon name={type === 'success' ? 'CheckCircle' : type === 'error' ? 'AlertTriangle' : 'Info'} className="w-4 h-4" />
                        {message}
                    </div>
                </div>
            );
        };

        // --- Scenario Data ---
        const mapSize = { w: 1000, h: 600 };
        const hub = { x: mapSize.w / 2, y: mapSize.h / 2 };

        const scenarioData = {
            industrial: {
                fleet: 4,
                capacity: 500,
                speed: 60,
                stops: [
                    { id: 1, name: "Factory 1", x: 180, y: 180, demand: 300, time: "08:00 - 10:00", truck: 1 },
                    { id: 2, name: "Warehouse 2", x: 780, y: 220, demand: 450, time: "08:30 - 10:30", truck: 2 },
                    { id: 3, name: "Plant 3", x: 320, y: 480, demand: 200, time: "09:00 - 11:00", truck: 1 },
                    { id: 4, name: "Mill 4", x: 750, y: 460, demand: 350, time: "10:00 - 12:00", truck: 2 },
                    { id: 5, name: "Works 5", x: 500, y: 120, demand: 150, time: "09:30 - 11:30", truck: 3 },
                ]
            },
            pharma: {
                fleet: 2,
                capacity: 150,
                speed: 75, // Faster for urgent cold-chain
                stops: [
                    { id: 1, name: "City Hospital", x: 300, y: 250, demand: 50, time: "08:00 - 08:30", truck: 1 },
                    { id: 2, name: "Med Lab", x: 700, y: 300, demand: 30, time: "08:15 - 08:45", truck: 1 },
                    { id: 3, name: "Clinic A", x: 400, y: 400, demand: 20, time: "09:00 - 09:30", truck: 2 },
                    { id: 4, name: "Pharmacy B", x: 600, y: 500, demand: 15, time: "09:15 - 09:45", truck: 2 },
                ]
            },
            ecommerce: {
                fleet: 3,
                capacity: 50,
                speed: 40, // Slower for urban traffic
                stops: [
                    { id: 1, name: "Apt 101", x: 200, y: 150, demand: 5, time: "09:00 - 12:00", truck: 1 },
                    { id: 2, name: "Apt 102", x: 250, y: 200, demand: 3, time: "09:00 - 12:00", truck: 1 },
                    { id: 3, name: "Apt 103", x: 800, y: 150, demand: 8, time: "09:00 - 12:00", truck: 2 },
                    { id: 4, name: "Apt 104", x: 850, y: 250, demand: 4, time: "10:00 - 13:00", truck: 2 },
                    { id: 5, name: "Apt 105", x: 300, y: 450, demand: 6, time: "11:00 - 14:00", truck: 3 },
                    { id: 6, name: "Apt 106", x: 400, y: 500, demand: 10, time: "11:00 - 14:00", truck: 3 },
                    { id: 7, name: "Apt 107", x: 600, y: 450, demand: 7, time: "12:00 - 15:00", truck: 3 },
                ]
            }
        };

        const generatePath = (points) => {
            if (points.length < 2) return "";
            let path = `M ${points[0].x},${points[0].y}`;
            for (let i = 1; i < points.length; i++) {
                const p0 = points[i-1], p1 = points[i];
                const midX = (p0.x + p1.x) / 2;
                const offsetY = (p1.y - p0.y) * 0.2;
                path += ` Q ${midX},${p0.y - offsetY} ${p1.x},${p1.y}`;
            }
            return path;
        };

        // --- Main App ---
        const App = () => {
            const [scenario, setScenario] = useState("industrial");
            const [fleet, setFleet] = useState(scenarioData.industrial.fleet);
            const [capacity, setCapacity] = useState(scenarioData.industrial.capacity);
            const [speed, setSpeed] = useState(scenarioData.industrial.speed);
            const [stops, setStops] = useState(scenarioData.industrial.stops);
            const [isAnimating, setIsAnimating] = useState(false);
            const [addStopMode, setAddStopMode] = useState(false);
            const [optimizing, setOptimizing] = useState(false);
            const [toast, setToast] = useState(null);
            
            // Form State
            const [newStop, setNewStop] = useState({ name: "", demand: "", duration: "", earliest: "08:00", latest: "20:00", x: "", y: "" });

            // Load Scenario Data Effect
            useEffect(() => {
                const data = scenarioData[scenario];
                setStops(data.stops);
                setFleet(data.fleet);
                setCapacity(data.capacity);
                setSpeed(data.speed);
                setToast({ message: `${scenario.toUpperCase()} scenario loaded.`, type: "info" });
            }, [scenario]);

            // Calculate Routes
            const trucks = [
                { id: 1, color: "#00E5FF", name: "Truck 1" },
                { id: 2, color: "#A855F7", name: "Truck 2" },
                { id: 3, color: "#FBBF24", name: "Truck 3" }
            ];

            const truckRoutes = trucks.map(t => {
                const tStops = stops.filter(s => s.truck === t.id);
                return { ...t, path: generatePath([hub, ...tStops, hub]), stops: tStops };
            }).filter(t => t.stops.length > 0);

            const handleMapClick = (e) => {
                if (!addStopMode) return;
                
                const rect = e.currentTarget.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * mapSize.w;
                const y = ((e.clientY - rect.top) / rect.height) * mapSize.h;
                
                setNewStop(prev => ({ ...prev, x: Math.round(x), y: Math.round(y) }));
                setAddStopMode(false);
                setToast({ message: `Coordinates captured: (${Math.round(x)}, ${Math.round(y)}). Fill remaining details.`, type: "info" });
            };

            const handleAddStop = () => {
                if (!newStop.name || !newStop.demand || !newStop.x || !newStop.y) {
                    setToast({ message: "Please fill all fields (or click map to set X/Y).", type: "error" });
                    return;
                }

                const id = stops.length + 1;
                const truckId = (id % 3) + 1; 
                setStops([...stops, { 
                    id, 
                    name: newStop.name, 
                    x: parseFloat(newStop.x), 
                    y: parseFloat(newStop.y), 
                    demand: parseInt(newStop.demand), 
                    time: `${newStop.earliest} - ${newStop.latest}`,
                    truck: truckId
                }]);
                
                setToast({ message: `${newStop.name} added and routed to Truck ${truckId}.`, type: "success" });
                setNewStop({ name: "", demand: "", duration: "", earliest: "08:00", latest: "20:00", x: "", y: "" });
            };

            const handleOptimize = () => {
                setOptimizing(true);
                setTimeout(() => {
                    setOptimizing(false);
                    setToast({ message: "OR-Tools GLS Re-optimization complete.", type: "success" });
                }, 2000);
            };

            const handleResetStops = () => {
                setStops(scenarioData[scenario].stops);
                setToast({ message: "Stops reset to scenario defaults.", type: "info" });
            };

            const handleExportCSV = () => {
                const logs = [
                    { id: "VRT-9921", time: "2023-10-24 14:02", hub: "Mumbai-West", fleet: "3/6", dist: "255 km", cost: "₹45,200", dropped: "0", solve: "2000ms" },
                    { id: "VRT-9920", time: "2023-10-24 12:15", hub: "Delhi-North", fleet: "4/5", dist: "410 km", cost: "₹88,400", dropped: "1", solve: "2400ms" },
                    { id: "VRT-9919", time: "2023-10-24 10:30", hub: "Bangalore-East", fleet: "2/4", dist: "180 km", cost: "₹32,100", dropped: "0", solve: "1800ms" },
                    { id: "VRT-9918", time: "2023-10-23 18:45", hub: "Mumbai-West", fleet: "5/6", dist: "520 km", cost: "₹102,500", dropped: "2", solve: "3100ms" },
                ];
                
                const headers = ["Instance ID", "Timestamp", "Depot Hub", "Fleet Active", "Distance", "Cost (INR)", "Dropped", "Solve Time"];
                const csvRows = [
                    headers.join(","),
                    ...logs.map(r => `"${r.id}","${r.time}","${r.hub}","${r.fleet}","${r.dist}","${r.cost}","${r.dropped}","${r.solve}"`)
                ];
                
                const blob = new Blob([csvRows.join("\\n")], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", "vectraflow_audit_log.csv");
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                setToast({ message: "Audit log exported to CSV successfully.", type: "success" });
            };

            const timeOptions = ["08:00", "09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00", "20:00"];

            return (
                <div className="min-h-screen p-4 md:p-6 space-y-6">
                    
                    {/* --- 1. TOP HEADER & SCENARIOS --- */}
                    <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
                        <div className="flex items-center gap-4">
                            <div className="bg-[#00E5FF]/10 p-3 rounded-2xl border border-[#00E5FF]/30 glow-cyan">
                                <Icon name="Truck" className="w-8 h-8 text-[#00E5FF]" />
                            </div>
                            <div>
                                <div className="flex items-center gap-3">
                                    <h1 className="text-2xl font-black text-white tracking-tight">VectraFlow OR</h1>
                                    <Badge color="cyan"><Icon name="Cpu" className="w-3 h-3" /> Google OR-Tools Engine</Badge>
                                </div>
                                <p className="text-xs text-slate-400 mt-1 font-medium">FTL/LTL Enterprise Dispatch Command Center</p>
                            </div>
                        </div>

                        <div className="flex flex-wrap gap-2 bg-white/5 p-1.5 rounded-xl border border-white/10">
                            {[
                                { id: "industrial", label: "National Industrial Corridor", icon: "Factory" },
                                { id: "pharma", label: "Cold-Chain Pharma", icon: "Snowflake" },
                                { id: "ecommerce", label: "Urban Last-Mile Fleet", icon: "ShoppingCart" }
                            ].map(s => (
                                <button 
                                    key={s.id}
                                    onClick={() => setScenario(s.id)}
                                    className={`flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-bold transition-all ${scenario === s.id ? 'bg-[#00E5FF] text-[#0A0E17] glow-cyan' : 'text-slate-400 hover:text-white hover:bg-white/5'}`}
                                >
                                    <Icon name={s.icon} className="w-3.5 h-3.5" />
                                    {s.label}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* --- 2. EXECUTIVE KPI DASHBOARD --- */}
                    <div className="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-4">
                        <Card className="p-5">
                            <div className="flex items-center justify-between mb-3">
                                <div className="bg-[#00E5FF]/10 p-2 rounded-lg"><Icon name="Route" className="w-4 h-4 text-[#00E5FF]" /></div>
                                <Badge color="emerald"><Icon name="TrendingDown" className="w-3 h-3" /> 34% Saved</Badge>
                            </div>
                            <h3 className="text-3xl font-black text-white">{stops.length * 45} <span className="text-lg text-slate-500">km</span></h3>
                            <p className="text-xs text-slate-400 mt-1 font-medium">Optimal Fleet Distance</p>
                        </Card>

                        <Card className="p-5">
                            <div className="flex items-center justify-between mb-3">
                                <div className="bg-[#00F0A3]/10 p-2 rounded-lg"><Icon name="BadgeIndianRupee" className="w-4 h-4 text-[#00F0A3]" /></div>
                                <Badge color="emerald"><Icon name="TrendingUp" className="w-3 h-3" /> vs Baseline</Badge>
                            </div>
                            <h3 className="text-3xl font-black text-white">₹1.2L</h3>
                            <p className="text-xs text-slate-400 mt-1 font-medium">Freight Cost Savings</p>
                        </Card>

                        <Card className="p-5">
                            <div className="flex items-center justify-between mb-3">
                                <div className="bg-amber-400/10 p-2 rounded-lg"><Icon name="Truck" className="w-4 h-4 text-amber-400" /></div>
                                <Badge color="amber">68% Capacity</Badge>
                            </div>
                            <h3 className="text-3xl font-black text-white">{truckRoutes.length} <span className="text-lg text-slate-500">/ {fleet} Trucks</span></h3>
                            <p className="text-xs text-slate-400 mt-1 font-medium">Active Fleet Trucks</p>
                        </Card>

                        <Card className="p-5">
                            <div className="flex items-center justify-between mb-3">
                                <div className="bg-[#00F0A3]/10 p-2 rounded-lg"><Icon name="CheckCircle" className="w-4 h-4 text-[#00F0A3]" /></div>
                                <Badge color="emerald"><Icon name="ShieldCheck" className="w-3 h-3" /> Verified</Badge>
                            </div>
                            <h3 className="text-3xl font-black text-[#00F0A3]">100%</h3>
                            <p className="text-xs text-slate-400 mt-1 font-medium">Time Window Compliance</p>
                        </Card>

                        <Card className="p-5">
                            <div className="flex items-center justify-between mb-3">
                                <div className="bg-purple-500/10 p-2 rounded-lg"><Icon name="Timer" className="w-4 h-4 text-purple-400" /></div>
                                <Badge color="cyan">GLS Engine</Badge>
                            </div>
                            <h3 className="text-3xl font-black text-white">2000 <span className="text-lg text-slate-500">ms</span></h3>
                            <p className="text-xs text-slate-400 mt-1 font-medium">OR-Tools Solver Latency</p>
                        </Card>
                    </div>

                        {/* LEFT SIDE: MAP & ANIMATION */}

                                <div className="flex flex-wrap justify-between items-center gap-4 mb-4">
                                    <div>
                                        <h2 className="text-lg font-bold text-white">Interactive Route Canvas</h2>
                                        <p className="text-xs text-slate-400">VRPTW Solver Visualization</p>
                                    </div>
                                    <div className="flex gap-2">

                                            <Icon name={isAnimating ? "Square" : "Play"} className="w-4 h-4" /> {isAnimating ? "Stop" : "Animate"}

                                            <filter id="glow"><feGaussianBlur stdDeviation="4" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                                        </defs>

                                        {/* Routes */}
                                        {truckRoutes.map((route, idx) => (
                                            <path 
                                                key={idx} d={route.path} fill="none" stroke={route.color} strokeWidth="3" 
                                                className="flow-line" style={{ filter: `drop-shadow(0 0 4px ${route.color})` }}

                                        {isAnimating && truckRoutes.map((route, idx) => (
                                            <circle key={idx} r="8" fill={route.color} style={{ filter: `drop-shadow(0 0 8px ${route.color})` }}>
                                                <animateMotion dur="6s" repeatCount="indefinite" path={route.path} />
                                            </circle>
                                        ))}

                                        {/* Hub */}
                                        <g transform={`translate(${hub.x}, ${hub.y})`}>
                                            <circle cx="0" cy="0" r="40" fill="none" stroke="#00E5FF" strokeWidth="1" opacity="0.1" />

                                        </g>
                                    </svg>

                                    {/* Hub Label (HTML overlaid) */}
                                    <div className="absolute pointer-events-none" style={{ left: '50%', top: '50%', transform: 'translate(-50%, 40px)' }}>
                                        <div className="text-[10px] font-bold text-[#00E5FF] bg-[#0A0E17]/90 px-2 py-1 rounded border border-[#00E5FF]/30">CENTRAL DEPOT</div>
                                    </div>

                                    {/* Customer Stops */}
                                    {stops.map(stop => {
                                        const leftPct = (stop.x / mapSize.w) * 100;
                                        const topPct = (stop.y / mapSize.h) * 100;
                                        const pointerEvents = addStopMode ? 'none' : 'auto';
                                        return (
                                            <div key={stop.id} className="absolute group" style={{ left: `${leftPct}%`, top: `${topPct}%`, transform: 'translate(-50%, -50%)', pointerEvents }}>
                                                <div className="relative">
                                                    <div className="w-5 h-5 rounded-full border-2 border-[#00F0A3] bg-[#0A0E17] flex items-center justify-center transition-transform group-hover:scale-125">
                                                        <div className="w-2 h-2 rounded-full bg-[#00F0A3] glow-emerald"></div>
                                                    </div>
                                                    <div className={`absolute ${topPct > 50 ? 'bottom-full mb-2' : 'top-full mt-2'} left-1/2 -translate-x-1/2 opacity-0 group-hover:opacity-100 transition-opacity z-20 pointer-events-none`}>
                                                        <div className="bg-[#0A0E17] border border-white/10 rounded-lg p-2 shadow-xl min-w-[140px]">
                                                            <div className="text-xs font-bold text-white mb-1">{stop.name}</div>
                                                            <div className="flex items-center gap-1.5 text-[10px] text-slate-300 mb-1">
                                                                <Icon name="Package" className="w-3 h-3 text-[#00F0A3]" /> Demand: {stop.demand} TEUs
                                                            </div>
                                                            <div className="flex items-center gap-1.5 text-[10px] text-slate-300">
                                                                <Icon name="Clock" className="w-3 h-3 text-slate-400" /> {stop.time}
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                {/* Info-box */}
                                <div className="mt-4 glass-panel-light p-4 flex items-start gap-3">
                                    <Icon name="Info" className="w-5 h-5 text-[#00E5FF] mt-0.5 flex-shrink-0" />
                                    <div>
                                        <h4 className="text-xs font-bold text-white mb-1">Network Flow Optimization vs Facility Assignment Gap Analysis</h4>
                                        <p className="text-[11px] text-slate-400 leading-relaxed">
                                            This engine utilizes Google OR-Tools Guided Local Search (GLS) to minimize transit distance while strictly adhering to Vehicle Routing Problem with Time Windows (VRPTW) constraints. It dynamically identifies gaps between facility capacity and network flow density.
                                        </p>
                                    </div>
                                </div>
                            </Card>
                        </div>

                        {/* RIGHT SIDE: CONTROLS & SCHEDULE */}
                        <div className="lg:col-span-5 flex flex-col gap-4">
                            
                            <Card className="p-5">
                                <div className="flex items-center gap-2 mb-4">
                                    <Icon name="SlidersHorizontal" className="w-4 h-4 text-[#00E5FF]" />
                                    <h3 className="text-sm font-bold text-white">Fleet Parameters</h3>
                                </div>
                                <div className="space-y-5 mb-6">
                                    <Slider label="Available Delivery Fleet" value={fleet} min={1} max={6} onChange={setFleet} />
                                    <Slider label="Truck Capacity" value={capacity} min={200} max={600} unit="TEUs" onChange={setCapacity} />
                                    <Slider label="Transit Speed" value={speed} min={35} max={85} unit="km/h" onChange={setSpeed} />
                                </div>
                                <StardustButton variant="cosmic" size="md" className="w-full" onClick={handleOptimize} disabled={optimizing}>
                                    <Icon name={optimizing ? "Loader" : "BrainCircuit"} className={`w-4 h-4 ${optimizing ? "animate-spin" : ""}`} />
                                    {optimizing ? "Executing GLS..." : "Execute OR-Tools Guided Local Search"}
                                </StardustButton>
                            </Card>

                            <Card className="p-5">
                                <div className="flex items-center gap-2 mb-4">
                                    <Icon name="PlusCircle" className="w-4 h-4 text-[#00F0A3]" />
                                    <h3 className="text-sm font-bold text-white">Interactive Customer Stop Builder</h3>
                                </div>
                                <div className="grid grid-cols-2 gap-3 mb-3">
                                    <div className="col-span-2"><Input label="Customer Name" value={newStop.name} onChange={e => setNewStop({...newStop, name: e.target.value})} placeholder="e.g., Warehouse 4" /></div>
                                    <Input label="TEU Demand" type="number" value={newStop.demand} onChange={e => setNewStop({...newStop, demand: e.target.value})} placeholder="150" />
                                    <Input label="Service Duration (min)" type="number" value={newStop.duration} onChange={e => setNewStop({...newStop, duration: e.target.value})} placeholder="30" />
                                    <div><label className="text-[10px] font-medium text-slate-500 uppercase tracking-wider mb-1 block">Earliest Arrival</label><Select value={newStop.earliest} onChange={v => setNewStop({...newStop, earliest: v})} options={timeOptions.map(t => ({value: t, label: t}))} /></div>
                                    <div><label className="text-[10px] font-medium text-slate-500 uppercase tracking-wider mb-1 block">Latest Arrival</label><Select value={newStop.latest} onChange={v => setNewStop({...newStop, latest: v})} options={timeOptions.map(t => ({value: t, label: t}))} /></div>
                                    <Input label="X Coord" type="number" value={newStop.x} onChange={e => setNewStop({...newStop, x: e.target.value})} placeholder="0-1000" />
                                    <Input label="Y Coord" type="number" value={newStop.y} onChange={e => setNewStop({...newStop, y: e.target.value})} placeholder="0-600" />
                                </div>
                                <div className="flex gap-2">
                                    <StardustButton variant="nebula" size="md" className="flex-1" onClick={handleAddStop}><Icon name="Plus" className="w-4 h-4" /> Add Stop & Optimize</StardustButton>
                                    <StardustButton variant="glass" size="md" onClick={handleResetStops}><Icon name="RotateCcw" className="w-4 h-4" /> Reset</StardustButton>

                                </div>
                                <div className="space-y-2 overflow-y-auto pr-2 flex-1">
                                    {stops.flatMap((stop, i) => {
                                        const route = truckRoutes.find(r => r.id === stop.truck);
                                        if (!route) return [];
                                        return [
                                            { id: `${stop.id}-a`, time: stop.time.split(" - ")[0], truck: stop.truck, event: `arrives at ${stop.name}`, color: route.color, icon: "LogIn" },

                        <Card className="p-5 lg:col-span-2">
                            <div className="flex items-center gap-2 mb-4">
                                <Icon name="GanttChart" className="w-4 h-4 text-[#00E5FF]" />
                                <h3 className="text-sm font-bold text-white">Time-Window Gantt Timeline</h3>
                            </div>
                            
                            {/* Time Axis */}
                            <div className="flex justify-between text-[10px] font-mono text-slate-500 mb-2 pl-12">
                                <span>08:00</span><span>10:00</span><span>12:00</span><span>14:00</span><span>16:00</span><span>18:00</span><span>20:00</span>
                            </div>

                            <div className="space-y-3">
                                {truckRoutes.map(route => (
                                    <div key={route.id} className="flex items-center gap-2">
                                        <div className="w-10 text-xs font-bold text-slate-400 flex-shrink-0">T{route.id}</div>
                                        <div className="relative flex-1 h-6 bg-white/5 rounded-md overflow-hidden">
                                            {/* Allowed Window (Transparent) */}
                                            <div className="absolute h-full bg-white/10 border-l-2 border-r-2 border-white/20" style={{ left: '10%', width: '60%' }}></div>
                                            {/* Actual Service Time (Solid) */}
                                            <div className="absolute h-full flex items-center justify-center text-[9px] font-bold text-[#0A0E17]" 
                                                style={{ left: '15%', width: '15%', backgroundColor: route.color, boxShadow: `0 0 10px ${route.color}` }}>
                                                09:15
                                            </div>
                                            <div className="absolute h-full flex items-center justify-center text-[9px] font-bold text-[#0A0E17]" 
                                                style={{ left: '40%', width: '15%', backgroundColor: route.color, boxShadow: `0 0 10px ${route.color}` }}>
                                                10:45
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <div className="mt-4 flex gap-4 text-[10px] text-slate-400">
                                <div className="flex items-center gap-1"><div className="w-2 h-2 bg-white/20 rounded-sm"></div> Allowed Window</div>
                                <div className="flex items-center gap-1"><div className="w-2 h-2 bg-[#00E5FF] rounded-sm"></div> Actual Service</div>
                            </div>
                        </Card>
                    </div>

                    {/* SQLite Audit Log Table */}
                    <Card className="p-5 overflow-hidden">
                        <div className="flex items-center gap-2 mb-4">
                            <Icon name="Database" className="w-4 h-4 text-[#00E5FF]" />
                            <h3 className="text-sm font-bold text-white">SQLite Optimization Audit Log</h3>
                            <button onClick={handleExportCSV} className="ml-auto text-[10px] font-bold px-2 py-1 rounded-md border bg-[#00E5FF]/10 text-[#00E5FF] border-[#00E5FF]/30 flex items-center gap-1 hover:bg-[#00E5FF]/20 transition-colors">
                                <Icon name="Download" className="w-3 h-3" /> Export CSV
                            </button>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="border-b border-white/10 text-[10px] uppercase text-slate-500 font-bold tracking-wider">
                                        <th className="py-3 px-2">Instance ID</th>
                                        <th className="py-3 px-2">Timestamp</th>
                                        <th className="py-3 px-2">Depot Hub</th>
                                        <th className="py-3 px-2">Fleet Active</th>
                                        <th className="py-3 px-2">Distance</th>
                                        <th className="py-3 px-2">Cost (INR)</th>
                                        <th className="py-3 px-2">Dropped</th>
                                        <th className="py-3 px-2">Solve Time</th>
                                    </tr>
                                </thead>
                                <tbody className="text-xs text-slate-300">
                                    {[
                                        { id: "VRT-9921", time: "2023-10-24 14:02", hub: "Mumbai-West", fleet: "3/6", dist: "255 km", cost: "₹45,200", dropped: "0", solve: "2000ms" },
                                        { id: "VRT-9920", time: "2023-10-24 12:15", hub: "Delhi-North", fleet: "4/5", dist: "410 km", cost: "₹88,400", dropped: "1", solve: "2400ms" },
                                        { id: "VRT-9919", time: "2023-10-24 10:30", hub: "Bangalore-East", fleet: "2/4", dist: "180 km", cost: "₹32,100", dropped: "0", solve: "1800ms" },
                                        { id: "VRT-9918", time: "2023-10-23 18:45", hub: "Mumbai-West", fleet: "5/6", dist: "520 km", cost: "₹102,500", dropped: "2", solve: "3100ms" },
                                    ].map((row, idx) => (
                                        <tr key={idx} className="border-b border-white/5 hover:bg-white/5 transition-colors">
                                            <td className="py-3 px-2 font-mono text-[#00E5FF]">{row.id}</td>
                                            <td className="py-3 px-2 font-mono">{row.time}</td>
                                            <td className="py-3 px-2">{row.hub}</td>
                                            <td className="py-3 px-2 font-mono">{row.fleet}</td>
                                            <td className="py-3 px-2 font-mono">{row.dist}</td>
                                            <td className="py-3 px-2 font-mono text-emerald-400">{row.cost}</td>
                                            <td className={`py-3 px-2 font-mono ${row.dropped !== "0" ? 'text-rose-400 font-bold' : ''}`}>{row.dropped}</td>
                                            <td className="py-3 px-2 font-mono">{row.solve}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </Card>

                    {/* Toast Notification Render */}
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}

                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
